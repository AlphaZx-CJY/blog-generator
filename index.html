<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 - My Blog</title>
    <meta name="description" content="个人博客，分享技术思考与实践">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/blog.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav-bar">
        <div class="nav-container">
            <div class="flex items-center gap-8">
                <a href="index.html" class="nav-brand">
                    <span class="brand-icon">B</span>
                    <span>My Blog</span>
                </a>
            </div>
            <div class="nav-actions">
                <button id="searchToggle" class="icon-btn" aria-label="搜索 (Cmd+K)">🔍</button>
                <button id="themeToggle" class="icon-btn" aria-label="切换主题">◐</button>
            </div>
        </div>
        
        <!-- Search Panel -->
        <div id="searchPanel" class="search-panel">
            <div class="search-wrapper">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="搜索文章..." class="search-input">
                    <kbd class="search-shortcut">ESC</kbd>
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="max-w-6xl mx-auto px-6" style="padding-top: var(--space-8);">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 pb-20">
                <!-- Sidebar -->
                <aside class="lg:col-span-3 sidebar-section">
                    <div class="sidebar-block">
                        <h3 class="sidebar-title">归档</h3>
                        <ul id="archiveList" class="sidebar-list">
                            <li class="sidebar-loading">加载中...</li>
                        </ul>
                    </div>

                    <div class="sidebar-block">
                        <h3 class="sidebar-title">标签</h3>
                        <div id="tagCloud" class="tag-cloud">
                            <span class="sidebar-loading">加载中...</span>
                        </div>
                    </div>

                    <div class="sidebar-block">
                        <h3 class="sidebar-title">分类</h3>
                        <ul id="categoryList" class="sidebar-list">
                            <li class="sidebar-loading">加载中...</li>
                        </ul>
                    </div>
                </aside>

                <!-- Posts List -->
                <div class="lg:col-span-9">
                    <!-- Filter Status -->
                    <div id="filterStatus" class="filter-status hidden">
                        <span id="filterLabel">筛选结果</span>
                        <button id="clearFilter" class="clear-filter-btn">清除</button>
                    </div>

                    <!-- Posts Container -->
                    <div id="postsContainer" class="posts-container">
                        <div class="loading-state">
                            <div class="spinner"></div>
                            <p>正在加载文章...</p>
                        </div>
                    </div>

                    <!-- Load More -->
                    <div id="loadMoreContainer" class="load-more-container hidden">
                        <button id="loadMoreBtn" class="load-more-btn">加载更多</button>
                    </div>

                    <!-- Empty State -->
                    <div id="emptyState" class="empty-state hidden">
                        <div class="empty-icon">📄</div>
                        <h3>暂无文章</h3>
                        <p>该分类下暂时没有文章</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-content">
                <p class="footer-text">© 2026 My Blog</p>
                <div class="footer-links">
                    <a href="#" target="_blank" class="footer-link" aria-label="GitHub">GH</a>
                    <a href="mailto:example@email.com" class="footer-link" aria-label="Email">@</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Back to Top -->
    <button id="backToTop" class="back-to-top" aria-label="回到顶部">↑</button>

    <script src="js/app.js"></script>
</body>
</html>
